<style>
:root{
 --void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;
 --line:#2a2934;--line-soft:#1f1e28;
 --cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;
 --brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;
 --green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;
 --serif:Georgia,'Libre Baskerville',ui-serif,serif;
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input[type=number]{font-family:var(--mono)}
a{color:var(--brass)}a:hover{color:var(--amber)}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}
.brand .name{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em}
.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

.client-pill{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;border-right:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--cream-dim)}
.client-pill:hover{background:var(--ink);color:var(--cream)}
.client-pill .who{font-family:var(--serif);font-size:13px;color:var(--brass)}
.client-pill .meta{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}
.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
.tool-btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.tool-btn.primary:hover{background:var(--amber);border-color:var(--amber)}
.tool-btn.t3{border-color:var(--blue);color:var(--blue)}

.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100dvh - 48px)}
aside.sidebar{background:var(--void-2);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:10px}
.sidebar h4{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;padding:0 4px}
.sidebar-search{display:flex;flex-direction:column;gap:6px}
.sidebar-search input,.sidebar-search select{font-size:12px;padding:6px 8px}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0}
.chip{padding:3px 8px;border-radius:11px;border:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase;cursor:pointer}
.chip:hover{border-color:var(--brass);color:var(--brass)}
.chip.on{background:var(--brass);color:var(--void);border-color:var(--brass)}
.client-list{display:flex;flex-direction:column;gap:3px}
.client-card{padding:9px 11px;border-radius:3px;cursor:pointer;border:1px solid transparent;border-left:3px solid var(--line);background:var(--ink);transition:all 0.1s}
.client-card:hover{background:var(--ink-2);border-left-color:var(--brass)}
.client-card.active{background:var(--ink-2);border-left-color:var(--brass);border-color:var(--line)}
.client-card .nm{font-family:var(--serif);font-size:13px;color:var(--cream);font-weight:600}
.client-card .sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.client-card .sub .tag{padding:1px 5px;border-radius:2px;background:var(--void);color:var(--cream-dim);font-size:9px}
.client-card .sub .tag.due{background:var(--ox);color:var(--cream)}
.client-card .sub .tag.amber{background:rgba(255,140,0,0.2);color:var(--amber)}
.client-card .sub .tag.green{background:rgba(74,222,128,0.15);color:var(--green)}
.empty-state{padding:18px;text-align:center;color:var(--cream-muted);font-size:12px;font-style:italic}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1280px;margin:0 auto;width:100%}

.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}
.disclaimer strong{color:var(--brass)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0.01em}
.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}
.section-h .actions{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px;color:var(--cream);letter-spacing:0.01em;display:flex;justify-content:space-between;align-items:baseline}
.card h3 .meta{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.1em;margin-left:8px;text-transform:uppercase}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kpi:last-child{border-bottom:none}
.kpi .l{color:var(--cream-dim)}
.kpi .v{font-family:var(--mono);color:var(--cream);font-weight:500}
.kpi .v.green{color:var(--green)}.kpi .v.red{color:var(--red)}.kpi .v.amber{color:var(--amber)}.kpi .v.brass{color:var(--brass)}.kpi .v.blue{color:var(--blue)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.row.r4{grid-template-columns:1fr 1fr 1fr 1fr}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.btn.primary:hover{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn.danger{border-color:var(--ox);color:var(--ox)}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,0.08)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{border-color:var(--line);color:var(--cream-dim)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
td.r{text-align:right;font-family:var(--mono)}
td.c{text-align:center}
tr.total td{font-weight:600;border-top:1px solid var(--brass);border-bottom:none;padding-top:10px}
tr.total td.r{color:var(--brass)}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--ink)}
tr.overdue{background:rgba(139,26,26,0.13)}
tr.soon{background:rgba(255,140,0,0.07)}

.bar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;margin:6px 0}
.bar > div{height:100%;background:var(--brass);transition:width 0.3s}
.bar > div.green{background:var(--green)}.bar > div.red{background:var(--red)}.bar > div.amber{background:var(--amber)}.bar > div.blue{background:var(--blue)}

.tag{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass);margin-right:4px}
.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.green{border-color:var(--green);color:var(--green)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.blue{border-color:var(--blue);color:var(--blue)}
.tag.dim{border-color:var(--line);color:var(--cream-muted)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}
.msg.user{background:var(--ink);align-self:flex-end;border-bottom-right-radius:2px}
.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start;border-bottom-left-radius:2px}
.msg.bot .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.08em;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;padding:11px 14px}

.tx-row{display:grid;grid-template-columns:0.8fr 1.4fr 1fr 0.7fr 0.6fr 0.5fr 32px;gap:6px;padding:6px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.tx-row.head{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.tx-row input,.tx-row select{padding:5px 7px;font-size:12px;width:100%}
.tx-row .x{cursor:pointer;color:var(--cream-muted);font-family:var(--mono);text-align:center}
.tx-row .x:hover{color:var(--red)}

.emp-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 0.7fr 32px;gap:6px;padding:6px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.emp-row.head{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.emp-row input,.emp-row select{padding:5px 7px;font-size:12px;width:100%}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:900;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.onboard{max-width:600px;margin:5vh auto;padding:36px 32px;background:var(--void-2);border:1px solid var(--brass);border-radius:6px}
.onboard h1{font-family:var(--serif);font-size:28px;color:var(--brass);margin-bottom:6px}
.onboard .lead{color:var(--cream-dim);margin-bottom:20px;font-size:13px}
.onboard .step{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px}

.subtabs{display:flex;gap:1px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{padding:8px 14px;font-size:12px;color:var(--cream-dim);font-family:var(--mono);letter-spacing:0.04em;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button:hover{color:var(--cream)}
.subtabs button.active{color:var(--brass);border-bottom-color:var(--brass)}

.drawer-toggle{display:none;padding:0 12px;height:100%;align-items:center;border-right:1px solid var(--line);cursor:pointer;color:var(--brass);font-size:18px}

.deadline-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.deadline-summary .ds{padding:10px 12px;background:var(--void-2);border:1px solid var(--line);border-radius:3px;text-align:center}
.deadline-summary .ds .v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--brass)}
.deadline-summary .ds .v.red{color:var(--red)}
.deadline-summary .ds .v.amber{color:var(--amber)}
.deadline-summary .ds .v.green{color:var(--green)}
.deadline-summary .ds .l{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--cream-muted);margin-top:4px}

@media (max-width:880px){
 .drawer-toggle{display:flex}
 .layout{grid-template-columns:1fr}
 aside.sidebar{position:fixed;top:48px;left:-320px;bottom:0;width:300px;z-index:50;transition:left 0.2s;box-shadow:0 0 30px rgba(0,0,0,0.6)}
 aside.sidebar.open{left:0}
 nav.tabs button{padding:0 10px;font-size:11px}
 main{padding:14px 14px 50px}
 .row,.row.r3,.row.r4{grid-template-columns:1fr}
 .tx-row,.emp-row{grid-template-columns:1fr 1fr;gap:4px}
 .tx-row.head,.emp-row.head{display:none}
 .brand .seal{display:none}
 .deadline-summary{grid-template-columns:repeat(2,1fr)}
}
</style>

  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];

  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;

    return { config: c, secrets: secrets, moved: remember ? 0 : moved };
  }
  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();

  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);

  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });

      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));

    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

    else {

      const place = () => placeChip(chip);
      setTimeout(place, 0); setTimeout(place, 1200);   // once now, once after the build has laid itself out

// TAX ENGINE · UK 2025-26 · T0 deterministic
// (income tax, NI 1/2/4, dividend, CGT, PA taper, marriage allowance, HICBC, CT marginal relief)
// ════════════════════════════════════════════════════════════════
function adjustedPersonalAllowance(income){
 const over=Math.max(0,income-RULES.paTaperStart);
 return Math.max(0,RULES.personalAllowance-Math.floor(over/2));
}
function incomeTax(income){
 const pa=adjustedPersonalAllowance(income);
 let remaining=Math.max(0,income-pa);
 const bands=[];let tax=0;
 const basic=Math.min(remaining,RULES.basicRateBand);
 if(basic>0){tax+=basic*RULES.basicRate;bands.push({label:'Basic 20%',amount:basic,tax:basic*RULES.basicRate});remaining-=basic}
 const higherBandSize=RULES.additionalRateStart-RULES.higherRateStart;
 const higher=Math.min(remaining,higherBandSize);
 if(higher>0){tax+=higher*RULES.higherRate;bands.push({label:'Higher 40%',amount:higher,tax:higher*RULES.higherRate});remaining-=higher}
 if(remaining>0){tax+=remaining*RULES.additionalRate;bands.push({label:'Additional 45%',amount:remaining,tax:remaining*RULES.additionalRate})}
 let marginalRate=0;
 if(income<=pa)marginalRate=0;
 else if(income<=RULES.higherRateStart)marginalRate=RULES.basicRate;
 else if(income<=RULES.additionalRateStart)marginalRate=RULES.higherRate;
 else marginalRate=RULES.additionalRate;
 if(income>RULES.paTaperStart&&income<=125140)marginalRate=0.60;
 return{tax,bands,paUsed:pa,marginalRate};
}
function nationalInsuranceEmployee(income){
 let ni=0;
 const main=Math.max(0,Math.min(income,RULES.niUpperEarningsLimit)-RULES.niPrimaryThreshold);
 ni+=main*RULES.niMainRate;
 const upper=Math.max(0,income-RULES.niUpperEarningsLimit);
 ni+=upper*RULES.niUpperRate;
 return{ni,mainAmount:main,upperAmount:upper};
}
function nationalInsuranceEmployer(grossPay){
 // Class 1 secondary 15% over TBA threshold (2025-26)
 const liable=Math.max(0,grossPay-RULES.niEmployerThreshold);
 return liable*RULES.niEmployerRate;
}
function nationalInsuranceSelfEmployed(profit){
 // Class 2 effectively abolished for those earning above small profits threshold (still voluntary)
 // Class 4: 6% between LPL-UPL, 2% above UPL
 if(profit<=RULES.niClass4LowerLimit)return{class2:0,class4:0,total:0};
 const class2=0; // post-2024 abolition for SE earners above SPT
 const lowerBand=Math.max(0,Math.min(profit,RULES.niClass4UpperLimit)-RULES.niClass4LowerLimit);
 const upperBand=Math.max(0,profit-RULES.niClass4UpperLimit);
 const class4=lowerBand*RULES.niClass4MainRate+upperBand*RULES.niClass4UpperRate;
 return{class2,class4,total:class2+class4,lowerBand,upperBand};
}
function dividendTax(dividend,salaryIncome){
 if(!dividend)return{tax:0,bands:[]};
 let taxable=Math.max(0,dividend-RULES.dividendAllowance);
 const pa=adjustedPersonalAllowance(salaryIncome+dividend);
 const taxableSalary=Math.max(0,salaryIncome-pa);
 const basicBandUsed=Math.min(taxableSalary,RULES.basicRateBand);
 const basicBandLeft=Math.max(0,RULES.basicRateBand-basicBandUsed);
 let tax=0;const bands=[];
 const inBasic=Math.min(taxable,basicBandLeft);
 if(inBasic>0){tax+=inBasic*RULES.dividendBasicRate;bands.push({label:'Div basic 8.75%',amount:inBasic,tax:inBasic*RULES.dividendBasicRate});taxable-=inBasic}
 const higherBandSize=RULES.additionalRateStart-RULES.higherRateStart;
 const inHigher=Math.min(taxable,higherBandSize);
 if(inHigher>0){tax+=inHigher*RULES.dividendHigherRate;bands.push({label:'Div higher 33.75%',amount:inHigher,tax:inHigher*RULES.dividendHigherRate});taxable-=inHigher}
 if(taxable>0){tax+=taxable*RULES.dividendAdditionalRate;bands.push({label:'Div additional 39.35%',amount:taxable,tax:taxable*RULES.dividendAdditionalRate})}
 return{tax,bands};
}
function capitalGainsTax(realisedGain,salaryIncome){
 if(realisedGain<=0)return{tax:0,bands:[]};
 const taxable=Math.max(0,realisedGain-RULES.cgtAllowance);
 if(taxable<=0)return{tax:0,bands:[{label:'Within £'+RULES.cgtAllowance+' allowance',amount:realisedGain,tax:0}]};
 const pa=adjustedPersonalAllowance(salaryIncome);
 const taxableSalary=Math.max(0,salaryIncome-pa);
 const basicLeft=Math.max(0,RULES.basicRateBand-Math.min(taxableSalary,RULES.basicRateBand));
 let tax=0;const bands=[];
 const inBasic=Math.min(taxable,basicLeft);
 if(inBasic>0){tax+=inBasic*RULES.cgtBasicRate;bands.push({label:'CGT basic 18%',amount:inBasic,tax:inBasic*RULES.cgtBasicRate})}
 const inHigher=taxable-inBasic;
 if(inHigher>0){tax+=inHigher*RULES.cgtHigherRate;bands.push({label:'CGT higher 24%',amount:inHigher,tax:inHigher*RULES.cgtHigherRate})}
 return{tax,bands};
}
function hicbc(highestIndividualIncome,childBenefitReceived){
 if(highestIndividualIncome<=RULES.hicbcLowerThreshold)return 0;
 if(highestIndividualIncome>=RULES.hicbcUpperThreshold)return childBenefitReceived;
 const range=RULES.hicbcUpperThreshold-RULES.hicbcLowerThreshold;
 const over=highestIndividualIncome-RULES.hicbcLowerThreshold;
 return childBenefitReceived*(over/range);
}
function savingsAllowance(income){
 if(income<=RULES.higherRateStart)return RULES.savingsAllowanceBasic;
 if(income<=RULES.additionalRateStart)return RULES.savingsAllowanceHigher;
 return RULES.savingsAllowanceAdditional;
}

// SA100 summary for a sole trader / director
function computeSA(client,opts){
 opts=opts||{};
 const sti=client.soleTraderIncome||{turnover:0,expenses:0,otherIncome:0,salaryPAYE:0,dividends:0,savings:0};
 // SE profit
 const seProfit=Math.max(0,(+sti.turnover||0)-(+sti.expenses||0));
 const salary=(+sti.salaryPAYE||0);
 const dividends=(+sti.dividends||0);
 const otherIncome=(+sti.otherIncome||0);
 const savings=(+sti.savings||0);
 const totalNonDivIncome=seProfit+salary+otherIncome+savings;
 const it=incomeTax(totalNonDivIncome);
 const dt=dividendTax(dividends,totalNonDivIncome);
 const ni=nationalInsuranceSelfEmployed(seProfit);
 const niEmp=salary>0?nationalInsuranceEmployee(salary):{ni:0,mainAmount:0,upperAmount:0};
 const savingsAllow=savingsAllowance(totalNonDivIncome+dividends);
 const savingsTaxFree=Math.min(savings,savingsAllow);
 const total=it.tax+dt.tax+ni.total+niEmp.ni;
 return{
 taxYear:opts.taxYear||TAX_YEAR,
 seProfit,salary,dividends,otherIncome,savings,
 totalIncome:totalNonDivIncome+dividends,
 personalAllowance:it.paUsed,
 incomeTax:it.tax,incomeTaxBands:it.bands,marginalRate:it.marginalRate,
 dividendTax:dt.tax,dividendBands:dt.bands,
 capitalGainsTax:0,
 class2NI:ni.class2,class4NI:ni.class4,
 employeeNI:niEmp.ni,
 savingsAllowance:savingsAllow,savingsTaxFree,
 totalDue:total,
 computedAt:now()};
}

// CT600 summary for a Ltd (marginal relief 19-25%)
function computeCT(taxableProfit,opts){
 opts=opts||{};
 const periodMonths=opts.periodMonths||12;
 // pro-rate the small profits & upper limits
 const ratio=periodMonths/12;
 const SPL=RULES.ctSmallProfitsLimit*ratio;
 const UPL=RULES.ctUpperLimit*ratio;
 const fraction=RULES.ctMarginalReliefFraction;
 let tax=0,note='',reliefAmount=0,effectiveRate=0;
 if(taxableProfit<=0){tax=0;note='No taxable profit'}
 else if(taxableProfit<=SPL){tax=taxableProfit*RULES.ctSmallProfitsRate;note='Small profits rate 19%'}
 else if(taxableProfit>=UPL){tax=taxableProfit*RULES.ctMainRate;note='Main rate 25%'}
 else{
 const mainTax=taxableProfit*RULES.ctMainRate;
 reliefAmount=(UPL-taxableProfit)*fraction;
 tax=mainTax-reliefAmount;
 note='Marginal relief 19→25%';
 }
 effectiveRate=taxableProfit>0?tax/taxableProfit:0;
 return{taxableProfit,tax,note,reliefAmount,effectiveRate,smallProfitsLimit:SPL,upperLimit:UPL,periodMonths,computedAt:now()};
}

// R&D claim · post-1 April 2024 merged scheme (above-the-line 20% taxable credit; SME-intensive R&D-intensive enhanced rate 86% uplift)
function computeRD(qualifyingExpenditure,opts){
 opts=opts||{};
 const intensiveRdScheme=!!opts.intensiveLoss; // R&D intensive SME (loss-making 30%+ R&D intensive)
 if(intensiveRdScheme){
 const uplift=qualifyingExpenditure*0.86;
 const enhancedDeduction=qualifyingExpenditure+uplift;
 const surrenderRate=0.146;
 const credit=enhancedDeduction*surrenderRate;
 return{scheme:'ERIS (intensive)',qualifyingExpenditure,uplift,enhancedDeduction,credit,note:'Loss-making R&D intensive SME — Enhanced R&D Intensive Support'};
 }
 // merged RDEC scheme: 20% above-the-line credit (taxable, net ~15-16.2%)
 const grossCredit=qualifyingExpenditure*0.20;
 const netCredit=grossCredit*(1-RULES.ctMainRate);
 return{scheme:'Merged RDEC (20%)',qualifyingExpenditure,grossCredit,netCredit,note:'Merged scheme · all accounting periods starting on/after 1 Apr 2024'};
}

// VAT computation
function computeVAT(client,periodStart,periodEnd,opts){
 opts=opts||{};
 const txs=state.transactions.filter(t=>t.clientId===client.id&&t.date>=periodStart&&t.date<=periodEnd);
 // VAT boxes (HMRC):
 // 1 = VAT due on sales (output VAT)
 // 2 = VAT due on EU acquisitions (legacy, NI only)
 // 3 = total VAT due (box 1+2)
 // 4 = VAT reclaimed on purchases (input VAT)
 // 5 = net VAT to pay / reclaim (box 3-4)
 // 6 = total sales excl VAT
 // 7 = total purchases excl VAT
 // 8 = supplies to EU (NI)
 // 9 = acquisitions from EU (NI)
 let box1=0,box4=0,box6=0,box7=0;
 for(const t of txs){
 const acct=findAccount(t.accountCode);if(!acct)continue;
 const amt=Math.abs(+t.amount||0);
 const isSale=acct.section==='income';
 const isPurchase=acct.section==='expenses'||acct.section==='costOfSales'||acct.section==='assets';
 const vatType=t.vatRate!=null?(t.vatRate==0.20?'standard':t.vatRate==0.05?'reduced':t.vatRate==0?'zero':'standard'):acct.vat;
 const isStandard=vatType==='standard';
 const isReduced=vatType==='reduced';
 const isReverse=vatType==='reverse'||vatType==='reverse-cis';
 if(isSale){
 if(isStandard){const net=amt/1.20;box6+=net;box1+=net*0.20}
 else if(isReduced){const net=amt/1.05;box6+=net;box1+=net*0.05}
 else {box6+=amt}
 }
 if(isPurchase){
 if(isStandard){const net=amt/1.20;box7+=net;box4+=net*0.20}
 else if(isReduced){const net=amt/1.05;box7+=net;box4+=net*0.05}
 else if(isReverse){const net=amt;box7+=net;box1+=net*0.20;box4+=net*0.20} // reverse charge: account for output + input both
 else {box7+=amt}
 }
 }
 // Flat rate adjustment
 if(client.vatScheme==='flat-rate'&&client.vatFlatRateSector){
 const ratePct=VAT_FLAT_RATE[client.vatFlatRateSector]||16.5;
 const grossSales=box6+box1; // VAT-inclusive turnover
 box1=grossSales*(ratePct/100);
 box4=0; // can only reclaim input on capital assets >TBAk under FRS
 }
 const box3=box1; // EU acquisitions box 2 = 0 unless NI
 const box5=box3-box4;
 return{
 clientId:client.id,
 periodStart,periodEnd,scheme:client.vatScheme,
 boxes:{
 1:+box1.toFixed(2),2:0,3:+box3.toFixed(2),4:+box4.toFixed(2),5:+box5.toFixed(2),
 6:Math.round(box6),7:Math.round(box7),8:0,9:0
 },
 transactions:txs.length,
 computedAt:now()};
}

// DEADLINE ENGINE · auto-generate per client
// ════════════════════════════════════════════════════════════════
function generateDeadlinesForClient(c){
 const out=[];
 const services=c.servicesEngaged||[];
 const pe=c.accountingPeriodEnd?new Date(c.accountingPeriodEnd):null;
 const ps=c.accountingPeriodStart?new Date(c.accountingPeriodStart):null;
 const today=new Date();
 const mkId=(kind,d)=>'dl_'+c.id+'_'+kind+'_'+isoDate(d);

 // SA100 — sole-trader OR sole-trader-with-services-sa OR directors of Ltd with personal SA
 if(c.entityType==='sole-trader'||services.includes('sa')){
 // 31 Jan after end of tax year (assume tax year is 6 Apr-5 Apr nearest to period end)
 const tyEnd=new Date(today.getFullYear(),3,5); // 5 Apr current
 if(today>tyEnd)tyEnd.setFullYear(tyEnd.getFullYear()+1);
 const sa100=new Date(tyEnd.getFullYear()+1,0,31);
 out.push({kind:'SA100',label:'SA100 Self Assessment '+(tyEnd.getFullYear()-1)+'-'+String(tyEnd.getFullYear()).slice(2),dueAt:isoDate(sa100),status:'pending',id:mkId('SA100',sa100)});
 // Payments on account · 31 Jan + 31 Jul
 out.push({kind:'SA-POA1',label:'SA payment on account #1',dueAt:isoDate(sa100),status:'pending',id:mkId('SA-POA1',sa100)});
 const poa2=new Date(sa100);poa2.setMonth(6);poa2.setDate(31);
 out.push({kind:'SA-POA2',label:'SA payment on account #2',dueAt:isoDate(poa2),status:'pending',id:mkId('SA-POA2',poa2)});
 }

 // CT600 + CT payment + Companies House
 if(c.entityType==='limited-company'){
 if(pe){
 const ct600=new Date(pe);ct600.setFullYear(ct600.getFullYear()+1);
 out.push({kind:'CT600',label:'CT600 Corporation Tax return',dueAt:isoDate(ct600),status:'pending',id:mkId('CT600',ct600)});
 const ctPay=new Date(pe);ctPay.setMonth(ctPay.getMonth()+9);ctPay.setDate(ctPay.getDate()+1);
 out.push({kind:'CT-PAY',label:'Corporation Tax payment',dueAt:isoDate(ctPay),status:'pending',id:mkId('CT-PAY',ctPay)});
 // Companies House annual accounts (private = 9 months after year end)
 const accDue=new Date(pe);accDue.setMonth(accDue.getMonth()+9);
 out.push({kind:'ACC',label:'Companies House accounts',dueAt:isoDate(accDue),status:'pending',id:mkId('ACC',accDue)});
 }
 // CS01 · confirmation statement · annually (one year after incorporation or last CS01)
 const cs01Anchor=c.lastConfirmationStatement||c.accountingPeriodStart||isoDate(today);
 const cs01=addDays(new Date(cs01Anchor),365);
 out.push({kind:'CS01',label:'Confirmation statement (CS01)',dueAt:isoDate(cs01),status:'pending',id:mkId('CS01',cs01)});
 }

 // VAT100 quarterly
 if(c.vatScheme&&c.vatScheme!=='none'&&c.vatNumber){
 // Generate next 4 quarterly returns based on registration date or year end
 const anchor=c.vatRegisteredDate?new Date(c.vatRegisteredDate):(pe?new Date(pe):new Date(today.getFullYear(),0,1));
 // Round to next quarter
 let q=new Date(anchor.getFullYear(),anchor.getMonth(),1);
 while(q<today)q=addMonths(q,3);
 for(let i=0;i<4;i++){
 const qEnd=addDays(addMonths(q,3),-1);
 const qDue=addDays(addMonths(qEnd,1),7);
 out.push({kind:'VAT100',label:'VAT100 '+isoDate(q).slice(0,7)+' to '+isoDate(qEnd).slice(0,7),dueAt:isoDate(qDue),status:'pending',id:mkId('VAT100',qDue),periodStart:isoDate(q),periodEnd:isoDate(qEnd)});
 q=addMonths(q,3);
 }
 }

 // PAYE · monthly EPS/P32, FPS on payday
 if(services.includes('payroll')&&c.payeReference){
 // P32 / EPS payment due 22nd of following month (or 19th if cheque)
 for(let i=0;i<3;i++){
 const m=new Date(today.getFullYear(),today.getMonth()+i,22);
 out.push({kind:'PAYE-RTI',label:'PAYE / NI payment '+isoDate(m).slice(0,7),dueAt:isoDate(m),status:'pending',id:mkId('PAYE',m)});
 }
 // P60 · 31 May
 const p60=new Date(today.getFullYear(),4,31);
 if(p60<today)p60.setFullYear(p60.getFullYear()+1);
 out.push({kind:'P60',label:'P60 employee certificate',dueAt:isoDate(p60),status:'pending',id:mkId('P60',p60)});
 // P11D · 6 July
 const p11d=new Date(today.getFullYear(),6,6);
 if(p11d<today)p11d.setFullYear(p11d.getFullYear()+1);
 out.push({kind:'P11D',label:'P11D benefits in kind',dueAt:isoDate(p11d),status:'pending',id:mkId('P11D',p11d)});
 }

 // Merge with existing (preserve submitted status)
 const existing=c.deadlines||[];
 const merged=out.map(d=>{
 const ex=existing.find(x=>x.id===d.id);
 return ex?Object.assign({},d,{status:ex.status,submittedAt:ex.submittedAt,submissionRef:ex.submissionRef,notes:ex.notes}):d;
 });
 // Preserve any existing deadlines that don't appear in regenerated set (manually added or submitted)
 for(const ex of existing){
 if(!merged.find(x=>x.id===ex.id))merged.push(ex);
 }
 merged.sort((a,b)=>a.dueAt<b.dueAt?-1:1);
 return merged;
}

 const diff=daysBetween(today,d.dueAt);

 return 'pending';
}

// PAYROLL · RTI-shaped FPS/EPS
// ════════════════════════════════════════════════════════════════
function computePayrollPeriod(client,periodStart,periodEnd,opts){
 opts=opts||{};
 const employees=client.employees||[];
 const monthsInPeriod=Math.max(1,Math.round((new Date(periodEnd)-new Date(periodStart))/2592000000));
 const periodsPerYear=client.payePeriod==='weekly'?52:12;
 const out={
 id:'pr_'+uid(),clientId:client.id,
 periodStart,periodEnd,
 payeReference:client.payeReference||'',
 employees:[],
 totals:{gross:0,paye:0,niEe:0,niEr:0,pension:0,net:0},
 fpsRef:'FPS-'+isoDate(periodEnd).replace(/-/g,'')+'-'+(Math.random().toString(36).slice(2,6).toUpperCase()),
 epsRef:'EPS-'+isoDate(periodEnd).slice(0,7).replace(/-/g,''),
 status:'draft',
 computedAt:now()};
 for(const e of employees){
 const annualSalary=+e.annualSalary||0;
 const periodGross=annualSalary/periodsPerYear*monthsInPeriod;
 // PAYE: simplified — applies cumulative tax-free PA and basic rate per period
 const periodPA=adjustedPersonalAllowance(annualSalary)/periodsPerYear*monthsInPeriod;
 const periodBasicBand=RULES.basicRateBand/periodsPerYear*monthsInPeriod;
 let taxable=Math.max(0,periodGross-periodPA);
 let paye=0;
 const basic=Math.min(taxable,periodBasicBand);paye+=basic*RULES.basicRate;taxable-=basic;
 const higherSize=(RULES.additionalRateStart-RULES.higherRateStart)/periodsPerYear*monthsInPeriod;
 const higher=Math.min(taxable,higherSize);paye+=higher*RULES.higherRate;taxable-=higher;
 if(taxable>0)paye+=taxable*RULES.additionalRate;
 // NI · per-period thresholds
 const periodPT=RULES.niPrimaryThreshold/periodsPerYear*monthsInPeriod;
 const periodUEL=RULES.niUpperEarningsLimit/periodsPerYear*monthsInPeriod;
 const periodErT=RULES.niEmployerThreshold/periodsPerYear*monthsInPeriod;
 const niEeMain=Math.max(0,Math.min(periodGross,periodUEL)-periodPT)*RULES.niMainRate;
 const niEeUpper=Math.max(0,periodGross-periodUEL)*RULES.niUpperRate;
 const niEe=niEeMain+niEeUpper;
 const niEr=Math.max(0,periodGross-periodErT)*RULES.niEmployerRate;
 const pension=(e.pensionPct||0)*periodGross;
 const studentLoan=e.studentLoan?Math.max(0,(periodGross-27295/periodsPerYear*monthsInPeriod))*0.09:0;
 const net=periodGross-paye-niEe-pension-studentLoan;
 const row={
 id:e.id||uid(),name:e.name,nino:e.nino||'',taxCode:e.taxCode||'1257L',
 gross:+periodGross.toFixed(2),paye:+paye.toFixed(2),niEe:+niEe.toFixed(2),niEr:+niEr.toFixed(2),
 pension:+pension.toFixed(2),studentLoan:+studentLoan.toFixed(2),net:+net.toFixed(2)
 };
 out.employees.push(row);
 out.totals.gross+=row.gross;out.totals.paye+=row.paye;out.totals.niEe+=row.niEe;out.totals.niEr+=row.niEr;out.totals.pension+=row.pension;out.totals.net+=row.net;
 }
 out.totals.p32Liability=+(out.totals.paye+out.totals.niEe+out.totals.niEr-(out.totals.employmentAllowance||0)).toFixed(2);
 // round totals
 ['gross','paye','niEe','niEr','pension','net'].forEach(k=>out.totals[k]=+out.totals[k].toFixed(2));
 return out;
}

function generateP60(client,employeeId,taxYear){
 // Sum payroll runs for the tax year for this employee
 const runs=state.payrollRuns.filter(r=>r.clientId===client.id);
 const matching=runs.flatMap(r=>r.employees.filter(e=>e.id===employeeId).map(e=>({run:r,e})));
 const totals={gross:0,paye:0,niEe:0,niEr:0,pension:0,net:0};
 for(const {e} of matching){
 totals.gross+=e.gross;totals.paye+=e.paye;totals.niEe+=e.niEe;totals.niEr+=e.niEr;totals.pension+=e.pension;totals.net+=e.net;
 }
 const emp=(client.employees||[]).find(e=>e.id===employeeId)||{name:'unknown'};
 return{
 form:'P60',taxYear,employer:client.entityName||clientName(client),employerPayeRef:client.payeReference,
 employee:{name:emp.name,nino:emp.nino,taxCode:emp.taxCode||'1257L'},
 totals,issuedAt:now()};
}

function answerT0(query){
 const q=String(query||'').trim();
 if(!q)return{found:false,answer:'Ask anything about UK accountancy practice — SA, CT, VAT, PAYE, R&D, Companies House.'};
 for(const r of T0_RULES){
 if(r.q.test(q))return{found:true,answer:r.a,source:'T0'};
 }
 // Dynamic computed answers
 const c=currentClient();
 if(/next deadline/i.test(q)&&c){
 const ds=(c.deadlines||[]).filter(d=>d.status!=='submitted').slice(0,3);
 if(ds.length)return{found:true,answer:'Next deadlines for **'+clientName(c)+'**:\n'+ds.map(d=>'• '+d.label+' — '+fmtDate(d.dueAt)+' ('+deadlineStatus(d)+')').join('\n'),source:'T0·computed'};
 }
 if(/CT.*on (\d+)|corporation tax.*£?(\d+)/i.test(q)){
 const m=q.match(/(\d{3})/);if(m){const p=+m[1];const r=computeCT(p);return{found:true,answer:'CT on £'+fmt(p)+' = **'+moneyP(r.tax)+'** ('+r.note+'). Effective rate '+pct(r.effectiveRate)+'.',source:'T0·computed'};}
 }
 return{found:false,answer:'No T0 rule matched. Try: "When is SA100 due?", "CT600 deadline?", "VAT MTD compliance?", "R&D SME post-2024?", "VAT flat-rate sectors?", "PAYE RTI vs FPS?", "Companies House late filing penalty?", "Marginal relief CT?", "Director\'s loan tax?", "Reverse charge VAT construction?", "PSC rules?", "Confirmation statement vs accounts?". Or connect a T3 BYOK key in Settings.'};
}

}

// ════════════════════════════════════════════════════════════════
// THE GATED AUDIT CHAIN — inlined verbatim by build-page.mjs: the shared kernel from fallhardened
// plus this repo's own byte layout.
//
// ⚑ SCOPED IN A CLOSURE. The kernel exports names the app also uses; left at top level a later
// declaration would silently win and every call site would be passing the wrong arguments to a
// function that still looked right.
// Do not edit between the markers: edit audit.mjs, re-run the gate, rebuild the page.
// ════════════════════════════════════════════════════════════════
const AUDITCHAIN=(function(){
/* __AUDIT_KERNEL__ */
// audit-chain.mjs — a tamper-evident log that can actually be checked.
//
// ⚑ WHY THIS EXISTS. Nine tools in this estate write a hash-linked audit log — clinic, vet, HR,
// recruitment, claims, legal, insurance, books, practice — and not one of them ever re-walked it.
// prevHash and docHash were written on every action and never read back, so the tamper-evidence was
// a claim about the data rather than a property of it. A regulator asking "prove this was not edited"
// would have been handed a log that could not answer.
//
// ⚑ AND WHY IT IS A FACTORY. The bug underneath the bug is that a writer and a verifier can disagree
// about WHICH BYTES were signed, and then a check passes that should not — or fails when nothing is
// wrong. Here both come out of one call and close over the same `payloadOf`, so they cannot drift.
// You cannot construct a verifier for one layout and a writer for another by accident.
//
// The byte layout itself is deliberately NOT fixed: the nine tools each sign different fields, and
// forcing one shape would either break their existing logs or quietly re-define what was signed.

/** The hash a chain starts from. An empty string, so the first entry has nothing behind it. */
const GENESIS = '';

const isFn = (f) => typeof f === 'function';

/**
 * Build a chain that can write and check its own entries.
 *
 * @param opts.sha256    async (string) => hex digest. Injected so this stays pure and testable.
 * @param opts.payloadOf (prevHash, entry, index) => string — exactly the bytes that get signed.
 *                   May return a promise: one tool in this estate hashes the payload first and signs
 *                   THAT, so the layout itself needs to await a digest.
 * @param opts.hashField which field on an entry holds the chain hash. Default "docHash". One tool
 *                   keeps two hashes — a docHash over the payload and a separate `hash` for the
 *                   link — so the field cannot be assumed.
 */
function auditChain(opts) {
  // A default parameter does not fire on an explicit null, and null is what a caller reading a
  // missing config hands you. Normalise, then read.
  const o = (opts && typeof opts === 'object') ? opts : {};
  const sha256 = o.sha256;
  const payloadOf = o.payloadOf;
  const hashField = (typeof o.hashField === 'string' && o.hashField) ? o.hashField : 'docHash';
  // ⚑ NOT EVERY CHAIN STARTS AT THE EMPTY STRING. One tool in this estate opens its log with 64
  // zeros. Assuming genesis would make its very first entry fail to verify, for ever.
  const genesis = (typeof o.genesis === 'string') ? o.genesis : GENESIS;
  if (!isFn(sha256)) throw new Error('auditChain needs a sha256(string) function');
  if (!isFn(payloadOf)) throw new Error('auditChain needs a payloadOf(prevHash, entry, index) function');

  /**
   * The hash the next entry must link to.
   *
   * The last row is read defensively because a corrupt log is exactly when this gets called: a null
   * or non-object at the end used to throw here, which turned "your audit log has a bad row" into
   * "the app crashed while trying to write an audit entry".
   */
  function headOf(entries) {
    const log = Array.isArray(entries) ? entries : [];
    if (!log.length) return genesis;
    const last = log[log.length - 1];
    if (!last || typeof last !== 'object') return genesis;
    return String(last[hashField] ?? '');
  }

  /**
   * Seal an entry onto the end of the log. Returns a NEW entry carrying prevHash and docHash —
   * it does not mutate what it was given, because an audit writer that edits its input is the
   * first thing anyone should distrust.
   */
  async function append(entries, entry) {
    const log = Array.isArray(entries) ? entries : [];
    const prevHash = headOf(log);
    // ⚑ RESPECT THE CALLER'S NUMBERING. These tools number entries from 1 and SIGN that number.
    // Overwriting it with a zero-based position would renumber every new entry and quietly change
    // what gets hashed.
    const given = (entry && typeof entry === 'object') ? entry.i : undefined;
    const i = Number.isFinite(given) ? given : log.length;
    const base = { ...(entry && typeof entry === 'object' ? entry : {}), i, prevHash };
    // ⚑ THE THIRD ARGUMENT IS THE POSITION IN THE LOG, NOT THE ENTRY'S OWN NUMBER. verify() walks the
    // array and passes the array index, so append must pass the same thing or a one-based log signs
    // one value and verifies against another — every entry written would fail its own check.
    // A layout that wants the entry's number reads it off the entry, where it lives.
    const pos = log.length;
    // await, because a layout may itself need to hash something before it can say what is signed.
    const digest = await sha256(await payloadOf(prevHash, base, pos));
    return { ...base, [hashField]: digest };
  }

  /**
   * Walk the log and report the FIRST entry that does not reproduce. The earliest break is when the
   * tampering happened; everything after it is just that break's wake, so reporting later ones would
   * bury the answer.
   *
   * `expectHead` is optional and closes the one hole a chain cannot close on its own — see below.
   */
  async function verify(entries, checkOpts) {
    const log = Array.isArray(entries) ? entries : [];
    const c = (checkOpts && typeof checkOpts === 'object') ? checkOpts : {};
    let prev = genesis;

    for (let i = 0; i < log.length; i++) {
      const e = (log[i] && typeof log[i] === 'object') ? log[i] : {};
      if (String(e.prevHash ?? '') !== prev) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry does not link to the one before it — something was inserted, removed or reordered' };
      }
      const expected = await sha256(await payloadOf(prev, e, i));
      if (expected !== e[hashField]) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry was altered after it was written' };
      }
      prev = e[hashField];
    }

    // ⚑ THE HONEST BOUND. A chain proves nothing was changed or removed from the MIDDLE. Delete the
    // last few entries and what remains is a perfectly valid chain — the log simply looks shorter.
    // The only defence is knowing what the head should be, from somewhere the editor could not reach.
    // Without expectHead this returns ok:true and SAYS the tail is unproven, rather than implying a
    // completeness it cannot demonstrate.
    if (c.expectHead != null) {
      if (String(c.expectHead) !== prev) {
        return { ok: false, brokeAt: log.length, id: null, entries: log.length,
                 reason: 'the log ends earlier than it should — entries were removed from the end' };
      }
      return { ok: true, entries: log.length, tailProven: true,
               reason: 'every entry reproduces its own hash, and the log ends where it was expected to' };
    }

    return {
      ok: true, entries: log.length, tailProven: false,
      reason: log.length
        ? 'every entry reproduces its own hash — but nothing here can prove entries were not removed from the END; keep the head hash somewhere separate to close that'
        : 'the log is empty',
    };
  }

  return { append, verify, headOf, payloadOf };
}


// audit.mjs — fallbooks's audit layout, and the chain built from it.
//
// ⚑ THE BYTES MUST NOT CHANGE. There are logs in the wild signed by the old inline writer. If this
// layout differs by one character, every entry a firm has already written stops reproducing and the
// verifier reports its whole history as tampered. Making a real audit trail look forged is a worse
// outcome than not checking it at all, so this is a faithful copy and audit.test.mjs pins it against
// the original formula.
//
// The chain semantics live in the shared, separately-gated audit-chain kernel. Only the byte layout
// is this repo's business.

function payloadOf(prevHash, entry) {
  const e = (entry && typeof entry === 'object') ? entry : {};
  return String(prevHash == null ? '' : prevHash)
    + String(e.ts ?? '') + String(e.action ?? '')
    + String(e.adviserId ?? '') + String(e.clientId ?? '')
    + JSON.stringify(e.payload ?? {});
}

/** The writer and the checker, from one call, over one layout — so they cannot drift apart. */
function makeAuditChain(sha256) {
  return auditChain({
    sha256,
    payloadOf: payloadOf,
    hashField: "docHash",
  });
}


/* __END_AUDIT_KERNEL__ */
return makeAuditChain(sha256);
})();
